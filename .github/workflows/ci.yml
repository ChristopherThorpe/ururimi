name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, types, unit tests, content
        run: pnpm check
      - run: pnpm build
      - name: Install browser
        run: pnpm --filter @ururimi/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
